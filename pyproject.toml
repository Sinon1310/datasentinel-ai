[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasentinel-ai"
version = "0.2.0"
description = "Agentic AI Data Engineering and Pipeline Observability Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "plotly>=5.19",
    "duckdb>=1.1",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
agents = [
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "groq>=1.0",
]
dev = ["pytest>=8.0"]
# Planned stack for later milestones; not imported yet.
platform = [
    "langchain>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyspark>=3.5",
    "chromadb>=0.5",
]

[tool.setuptools.packages.find]
include = ["datasentinel*", "datasentinel_agents*", "app*"]

[tool.setuptools.package-data]
datasentinel_agents = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls the real Groq API (requires GROQ_API_KEY); run with -m live",
]
