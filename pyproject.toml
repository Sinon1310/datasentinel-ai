[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasentinel-ai"
version = "0.1.0"
description = "Agentic AI Data Engineering and Pipeline Observability Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "plotly>=5.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Planned stack for later milestones; not imported by Milestone 1 code.
platform = [
    "langchain>=0.3",
    "langchain-groq>=0.3",
    "langgraph>=0.6",
    "groq>=0.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "pyspark>=3.5",
    "chromadb>=0.5",
]

[tool.setuptools.packages.find]
include = ["datasentinel*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
